scenario_name: public_docking_flight_software
scenario_description: Two cooperative stacks align the ports, authorize contact capture,
  and confirm hard mate.
metadata:
  owner: public
  public_surface: public-example
  support_level: experimental
objects:
  target:
    kind: satellite
    specs:
      mass_kg: 100
      mass_properties:
        inertia_kg_m2: [[25, 0, 0], [0, 25, 0], [0, 0, 20]]
        inertia_reference_point: center_of_mass
      flight_software_hardware:
        max_force_n: 8.0
        max_torque_n_m: 1.5
    initial_state:
      position_eci_km: [7000, 0, 0]
      velocity_eci_km_s: [0, 7.5, 0]
      attitude_quat_bn: [1, 0, 0, 0]
      angular_rate_body_rad_s: [0.006, 0.004, 0.0]
    knowledge:
      numeric_backend: python
    flight_software:
      module: sim.flight_software.docking_example
      class_name: CooperativeDockingStack
      hardware_profile: hardware.ideal_wrench.v1
      task_period_s: 0.05
      params:
        role: receiver
        navigation_initialization: ideal
  chaser:
    kind: satellite
    specs:
      mass_kg: 100
      mass_properties:
        inertia_kg_m2: [[25, 0, 0], [0, 25, 0], [0, 0, 20]]
        inertia_reference_point: center_of_mass
      flight_software_hardware:
        max_force_n: 8.0
        max_torque_n_m: 1.5
    initial_state:
      position_eci_km: [7000.000045, 2.5e-05, 0.00135]
      velocity_eci_km_s: [0, 7.5, 0]
      attitude_quat_bn: [0.04997916927067833, 0.9987502603949663, 0, 0]
    knowledge:
      numeric_backend: python
    flight_software:
      module: sim.flight_software.docking_example
      class_name: CooperativeDockingStack
      hardware_profile: hardware.ideal_wrench.v1
      task_period_s: 0.05
      params:
        role: probe
        navigation_initialization: ideal
simulator:
  duration_s: 20.0
  dt_s: 0.1
  dynamics:
    orbit:
      model: two_body
      integrator: rk4
      numeric_backend: python
    attitude:
      enabled: true
      numeric_backend: python
    rocket:
      numeric_backend: python
    reentry:
      numeric_backend: python
  docking:
    enabled: true
    probe:
      object_id: chaser
      offset_body_m: [0, 0, 0.5]
      radius_m: 0.2
    receiver:
      object_id: target
      offset_body_m: [0, 0, 0.5]
      radius_m: 0.25
    max_step_s: 0.005
    contact_stiffness_n_m: 1500
    contact_damping_n_s_m: 25
    max_compression_m: 0.025
    latch:
      capture_lateral_m: 0.02
      capture_angle_rad: 0.05
      capture_speed_m_s: 0.15
      capture_rate_rad_s: 0.1
      stiffness_n_m: 500
      damping_n_s_m: 280
      angular_stiffness_n_m_rad: 100
      angular_damping_n_m_s_rad: 80
      max_travel_m: 0.05
      max_force_n: 150
      max_torque_n_m: 40
    hard_mate:
      position_m: 0.001
      angle_rad: 0.005
      speed_m_s: 0.003
      rate_rad_s: 0.005
      dwell_s: 0.15
    commanded: true
outputs:
  mode: save
  output_dir: outputs/examples/public_docking_flight_software
  stats:
    save_full_log: false
    print_summary: false
  plots:
    enabled: false
  review:
    enabled: true
    detail: full
