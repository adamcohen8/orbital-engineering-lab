[package]
name = "oel-rust-ogp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Public OEL OGP-SGP4/SDP4 scalar and parallel batch propagation"

[lib]
name = "oel_rust_ogp"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29.2", optional = true, features = ["extension-module", "abi3-py310"] }
sgp4 = { version = "=2.4.0", path = "../oel-orbit/vendor/sgp4" }

[build-dependencies]
pyo3-build-config = "=0.29.2"

[profile.release]
lto = "thin"
codegen-units = 1
