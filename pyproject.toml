[build-system]
requires = ["setuptools>=84.1,<85", "wheel>=0.46,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-engineering-lab"
version = "1.0.0"
description = "Integrated spacecraft simulation and analysis platform for rendezvous, control, validation, and mission prototyping."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE.txt", "sim/dynamics/orbit/data/LICENSE-HPOP-Harris-Priester.txt"]
authors = [
  { name = "Orbital Engineering Lab Contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "oel-rust-game>=0.5.1,<0.6",
  "oel-rust-orbit>=0.18.4,<0.19",
  "numpy>=2.1,<2.5",
  "jsonschema>=4.26,<5",
  "matplotlib>=3.8,<3.12",
  "Pillow==12.3.0; python_version < '3.11'",
  "Pillow>=13,<14; python_version >= '3.11'",
  "tqdm>=4.65,<5",
  "PyYAML>=6.0,<7",
  "scipy>=1.14.1,<1.18",
  "pyerfa>=2.0.1.5,<3",
]

[project.scripts]
oel = "sim.installation.cli:main"
oel-sim = "run_simulation:main"
oel-mcp = "integrations.oel_mcp.public_server:main"
oel-study-mcp = "integrations.oel_mcp.study_server:main"

[project.optional-dependencies]
acquisition = [
  "keyring>=25,<26",
]
io = [
  "sgp4>=2.24,<3",
  "spiceypy>=8,<9",
  "pyarrow>=21,<27",
]
twin = [
  "pypdf>=6.10,<7",
  "openpyxl>=3.1.5,<4",
]
dev = [
  "pytest>=9,<10",
  "ruff==0.15.14",
  "setuptools>=84.1,<85",
  "tomli>=2,<3; python_version < '3.11'",
]
game = [
  "oel-rust-game>=0.5.1,<0.6",
  "oel-rust-orbit>=0.18.4,<0.19",
  "pygame>=2.5,<3; python_version < '3.14'",
  "pygame-ce>=2.5,<3; python_version >= '3.14'",
  "Pillow==12.3.0; python_version < '3.11'",
  "Pillow>=13,<14; python_version >= '3.11'",
  "imageio>=2.34,<3",
  "imageio-ffmpeg>=0.4,<1",
]
ml = [
  "gymnasium>=0.29,<2",
  "torch>=2.13,<2.14",
  "filelock>=3.20.3,<4; python_version < '3.11'",
  "filelock>=4.2.1,<5; python_version >= '3.11'",
]
accel = [
  "numba>=0.61,<0.67",
]
validation = [
  "sgp4>=2.24,<3",
]
cross-platform = [
  "pytest>=9,<10",
  "ruff==0.15.14",
  "setuptools>=84.1,<85",
  "tomli>=2,<3; python_version < '3.11'",
  "oel-rust-game>=0.5.1,<0.6",
  "oel-rust-orbit>=0.18.4,<0.19",
  "pygame>=2.5,<3; python_version < '3.14'",
  "pygame-ce>=2.5,<3; python_version >= '3.14'",
  "Pillow==12.3.0; python_version < '3.11'",
  "Pillow>=13,<14; python_version >= '3.11'",
  "imageio>=2.34,<3",
  "imageio-ffmpeg>=0.4,<1",
  "numba>=0.61,<0.67; platform_system != 'Darwin' or platform_machine != 'x86_64'",
  "sgp4>=2.24,<3",
]
mcp = [
  "mcp>=2.0.0,<3",
]
full = [
  "keyring>=25,<26",
  "pytest>=9,<10",
  "ruff==0.15.14",
  "setuptools>=84.1,<85",
  "tomli>=2,<3; python_version < '3.11'",
  "oel-rust-game>=0.5.1,<0.6",
  "oel-rust-orbit>=0.18.4,<0.19",
  "pygame>=2.5,<3; python_version < '3.14'",
  "pygame-ce>=2.5,<3; python_version >= '3.14'",
  "Pillow==12.3.0; python_version < '3.11'",
  "Pillow>=13,<14; python_version >= '3.11'",
  "imageio>=2.34,<3",
  "imageio-ffmpeg>=0.4,<1",
  "gymnasium>=0.29,<2",
  "torch>=2.13,<2.14",
  "filelock>=3.20.3,<4; python_version < '3.11'",
  "filelock>=4.2.1,<5; python_version >= '3.11'",
  "numba>=0.61,<0.67",
  "scipy>=1.14.1,<1.18",
  "sgp4>=2.24,<3",
  "mcp>=2.0.0,<3",
]

[tool.setuptools]
include-package-data = false
py-modules = ["run_simulation", "run_game"]

[tool.setuptools.data-files]
"share/oel/configs" = ["configs/reference_gnc_vbar_approach.yaml", "configs/reference_gnc_nadir_pointing.yaml", "configs/reference_gnc_rpo_executive.yaml", "configs/ric_pd_10km_experiment.yaml", "configs/quickstart_5min.yaml", "configs/acceptance_relative_coast.yaml", "configs/mars_reference_drag.yaml", "configs/sun_centered_srp.yaml", "configs/controller_bench_attitude.yaml", "configs/controller_bench_attitude_case_nominal.yaml", "configs/controller_bench_attitude_case_rate_recovery.yaml"]

[tool.setuptools.package-data]
sim = [
  "data_acquisition/schemas/*.json",
  "presets/objects/*.yaml",
  "dynamics/orbit/data/*.csv",
  "dynamics/orbit/data/*.dat",
  "dynamics/orbit/data/*.json",
  "dynamics/orbit/data/*.txt",
  "dynamics/planetary/data/*",
  "interchange/schemas/*.json",
  "interchange/examples/*.json",
  "interchange/examples/*.md",
  "interchange/examples/*.oem",
  "interchange/examples/*.opm",
  "interchange/examples/*.omm",
  "installation/schemas/*.json",
  "installation/data/*.md",
  "execution/run_lifecycle/schemas/*.json",
  "fsw_authoring/schemas/*.json",
  "fswdk/schemas/*.json",
  "fsw_authoring/sdk/LICENSE.txt",
  "fsw_authoring/sdk/c/oel_fsw.h",
  "fsw_authoring/sdk/c/oel_fsw.c",
  "fsw_authoring/sdk/c/CMakeLists.txt",
  "fsw_authoring/sdk/cpp/oel_fsw.hpp",
  "fsw_authoring/sdk/rust/Cargo.toml",
  "fsw_authoring/sdk/rust/build.rs",
  "fsw_authoring/sdk/rust/src/lib.rs",
  "scale/schemas/*.json",
  "*/data/*.txt",
  "game/configs/*.yaml",
  "game/assets/*.png",
  "game/assets/*.md",
  "game/music/*.md",
]
"integrations.oel_mcp" = [
  "resource_data/*.md",
]

"sim.pro_perturbations" = ["*.txt"]
"sim.agent_operations" = ["fixtures/*.json"]
"integrations.cfs_sil" = ["*.yaml", "*.md", "cfs_*/**/*"]
"sim.pro_slr_od" = ["NOTICE.txt", "data/*.txt"]

[tool.setuptools.exclude-package-data]
sim = [
  "game/music/*.wav",
]

[tool.setuptools.packages.find]
include = ["sim*", "machine_learning*", "integrations.oel_mcp*", "integrations.cfs_sil*"]
exclude = ["sim.tests", "sim.tests.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
  "build",
  "dist",
  "examples/experiments",
  "outputs",
  "examples/outputs",
  "validation/High Precision Orbit Propagator_4-2",
  "validation/data",
  "validation/external",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "NPY201",
  "UP",
]
ignore = [
  "E501",
  "B905",
  "UP007",
  "UP035",
  "UP041",
]

[tool.ruff.lint.isort]
known-first-party = ["integrations", "machine_learning", "sim", "tools"]

[tool.ruff.lint.per-file-ignores]
"integrations/cfs_sil/mock_cfs_endpoint.py" = ["E402"]
"machine_learning/gym_env.py" = ["E402"]
"sim/dynamics/orbit/_sdp4_equations.py" = ["E101", "E702", "E703", "I001", "UP030", "UP032"]
"validation/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["sim/tests"]
markers = [
  "smoke: fast first-line checks for core import, API, quickstart, and release workflow health",
  "product: tests protecting documented product workflows, public contracts, and release-facing behavior",
  "regression: ordinary regression coverage for supported behavior",
  "fast: measured sub-second and ordinary deterministic checks for rapid local feedback",
  "compiled: tests that intentionally exercise accelerated backend selection, parity, or fallback behavior",
  "validation: tests or tooling checks tied to validation evidence, fidelity, or release governance",
  "slow: tests that are comparatively expensive and better suited to scheduled or full-suite runs",
  "external: tests covering optional integrations, external-tool bridges, or dependency-boundary behavior",
  "local_evidence: tests that require preserved local-only evidence intentionally absent from CI checkouts",
]
