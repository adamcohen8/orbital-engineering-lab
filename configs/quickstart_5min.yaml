schema_version: oel.scenario.v1
scenario_name: quickstart_5min
scenario_description: >-
  Five-minute public quickstart for deterministic two-satellite relative-motion
  hold. Both spacecraft maneuver. The target uses an ideal actuator that
  contributes to the reported delta-v without consuming propellant.
  Full-duration completion is not a terminal-rendezvous success criterion.
metadata:
  owner: public
  public_surface: public-quickstart
  support_level: supported
  notes: Run with `.venv/bin/python run_simulation.py --config configs/quickstart_5min.yaml`,
    then open outputs/quickstart_5min/index.md.
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
      thruster: BASIC_CHEMICAL_Z_BOTTOM
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      relative_to_target_ric:
        frame: curv
        state:
        - 0.0
        - -3.0
        - 0.1
        - 0.0
        - 0.0002
        - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    knowledge:
      refresh_rate_s: 2.0
      targets:
      - target
      conditions:
        require_line_of_sight: true
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.005
        - 0.005
        - 0.005
        vel_sigma_km_s:
        - 5.0e-05
        - 5.0e-05
        - 5.0e-05
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        reference_object_id: target
        translation_mode: ric_hold
        goal_type: rpo.ric_hold
  target:
    enabled: true
    role: target
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 360.0
      fuel_mass_kg: 0.0
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    knowledge:
      refresh_rate_s: 5.0
      targets:
      - chaser
      conditions:
        require_line_of_sight: true
        max_range_km: 50000.0
      sensor_error:
        pos_sigma_km:
        - 0.02
        - 0.02
        - 0.02
        vel_sigma_km_s:
        - 0.0002
        - 0.0002
        - 0.0002
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        reference_object_id: chaser
        translation_mode: ric_hold
        goal_type: rpo.ric_hold
simulator:
  duration_s: 300.0
  dt_s: 5.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 5.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: true
      attitude_substep_s: 0.1
      disturbance_torques:
        gravity_gradient: false
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/quickstart_5min
  mode: save
  stats:
    enabled: true
    print_summary: true
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
  review:
    enabled: true
    detail: standard
